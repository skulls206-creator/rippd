<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9B30FF" />
  <title>RIPPD – Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      gap: 1.5rem;
      padding: 2rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
    }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    h1 span { color: #9B30FF; }
    p { color: rgba(255,255,255,0.55); font-size: 0.95rem; max-width: 300px; line-height: 1.6; }
    button {
      background: #9B30FF;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <img class="logo" src="/icons/icon-128.png" alt="RIPPD" />
  <h1>RIPP<span>D</span></h1>
  <p>You're offline. Check your connection and try again — RIPPD needs the internet to rip audio.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
